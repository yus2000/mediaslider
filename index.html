<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Media Slider - Google Drive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; }

    .fullscreen {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #media-display {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #media-display img, #media-display video {
      max-width: 100vw;
      max-height: 100vh;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Floating Action Container - Kanan Bawah */
    .controls-container {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    /* Class aktif saat mouse digerakkan */
    .controls-container.active {
      opacity: 1;
      visibility: visible;
    }

    .btn-action {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 16px;
      cursor: pointer;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      backdrop-filter: blur(4px);
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      transform: scale(1.05);
    }

    /* Modal Styling */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal.hidden { display: none; }
    
    .modal-content {
      background: #fff; padding: 24px; border-radius: 12px; width: 340px;
      display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .modal-content h2 { font-size: 1.2rem; margin-bottom: 4px; color: #333; }
    .modal-content label { font-size: 0.85rem; font-weight: bold; color: #555; margin-bottom: -6px; }
    .modal-content input {
      padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; width: 100%;
    }
    .modal-content button {
      padding: 10px; background: #007bff; color: white; border: none; border-radius: 6px;
      font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 4px;
    }
    .modal-content button:hover { background: #0056b3; }
    .modal-content button.close-btn { background: #6c757d; }
    .modal-content button.close-btn:hover { background: #5a6268; }
    .modal-content button.logout-btn { background: #dc3545; }
    .modal-content button.logout-btn:hover { background: #bd2130; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Fullscreen Display Area -->
  <div id="slider-container" class="fullscreen">
    <div id="media-display">
      <h3 style="color: white; font-weight: normal;">Memuat media...</h3>
    </div>

    <!-- Tombol Kontrol Kanan Bawah (Otomatis muncul jika mouse bergerak) -->
    <div id="controls-bar" class="controls-container">
      <button class="btn-action" onclick="toggleFullscreen()">
        <span id="fs-icon">⛶</span> Fullscreen
      </button>
      <button class="btn-action" onclick="openAdminModal()">⚙️ Admin</button>
    </div>
  </div>

  <!-- Admin Panel Modal -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Panel Admin</h2>
      
      <!-- Login Form -->
      <div id="login-form" style="display: flex; flex-direction: column; gap: 10px;">
        <input type="password" id="admin-pass" placeholder="Password Admin">
        <button onclick="loginAdmin()">Login</button>
      </div>

      <!-- Settings Form -->
      <div id="admin-controls" class="hidden" style="display: flex; flex-direction: column; gap: 10px;">
        <label>Google Drive API Key:</label>
        <input type="text" id="drive-api-key" placeholder="API Key Default">

        <label>Folder ID Google Drive:</label>
        <input type="text" id="drive-folder-id" placeholder="Folder ID Default">
        
        <label>Interval Slide (Detik):</label>
        <input type="number" id="slide-interval" value="5" min="1">

        <label>Password Admin Baru:</label>
        <input type="password" id="new-admin-pass" placeholder="Kosongkan jika tak diubah">

        <button onclick="saveSettings()">Simpan & Sync</button>
        <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
      </div>

      <button class="close-btn" onclick="closeAdminModal()">Tutup</button>
    </div>
  </div>

  <script>
    // ============================================================
    // KONFIGURASI DEFAULT (TULISKAN LANGSUNG DI SINI)
    // ============================================================
    const DEFAULT_API_KEY = 'MASUKKAN_GOOGLE_DRIVE_API_KEY_ANDA_DI_SINI';
    const DEFAULT_FOLDER_ID = 'MASUKKAN_FOLDER_ID_GOOGLE_DRIVE_DI_SINI';
    const DEFAULT_PASSWORD = 'admin123';
    const DEFAULT_INTERVAL = 5; // detik

    let mediaList = [];
    let currentIndex = 0;
    let slideTimer = null;
    let mouseTimer = null;

    // Register Service Worker untuk PWA / Offline Caching
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'media-slider-v1';
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
        self.addEventListener('fetch', e => {
          e.respondWith(
            caches.match(e.request).then(res => res || fetch(e.request))
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
    }

    // Fungsi Mengambil Konfigurasi
    function getApiKey() {
      return localStorage.getItem('drive_api_key') || DEFAULT_API_KEY;
    }

    function getFolderId() {
      return localStorage.getItem('drive_folder_id') || DEFAULT_FOLDER_ID;
    }

    function getAdminPassword() {
      return localStorage.getItem('admin_password') || DEFAULT_PASSWORD;
    }

    function getSlideInterval() {
      return parseInt(localStorage.getItem('slide_interval')) || DEFAULT_INTERVAL;
    }

    // Inisialisasi Saat Halaman Dimuat
    window.onload = () => {
      document.getElementById('drive-api-key').value = getApiKey();
      document.getElementById('drive-folder-id').value = getFolderId();
      document.getElementById('slide-interval').value = getSlideInterval();

      loadMedia();
      startSlider();
      setupMouseHoverEffect();
    };

    // Logika Auto-Hide Tombol saat Mouse Digerakkan
    function setupMouseHoverEffect() {
      const controlsBar = document.getElementById('controls-bar');

      window.addEventListener('mousemove', () => {
        controlsBar.classList.add('active');
        clearTimeout(mouseTimer);
        
        // Sembunyikan tombol lagi jika mouse tidak bergerak selama 3 detik
        mouseTimer = setTimeout(() => {
          controlsBar.classList.remove('active');
        }, 3000);
      });
    }

    // Fungsi Toggle Fullscreen Mode
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.error(`Gagal masuk layar penuh: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Fetch daftar file dari Google Drive API
    async function fetchFromDrive(folderId, apiKey) {
      if (!folderId || !apiKey || folderId.includes('MASUKKAN_') || apiKey.includes('MASUKKAN_')) {
        return [];
      }

      const query = encodeURIComponent(`'${folderId.trim()}' in parents and trashed = false`);
      const url = `https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id,mimeType,name)&key=${apiKey.trim()}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          console.error("Google Drive API Error:", data.error.message);
          return [];
        }

        if (!data.files) return [];

        return data.files.map(file => ({
          url: `https://lh3.googleusercontent.com/d/${file.id}`,
          type: file.mimeType.startsWith('video/') ? 'video' : 'image'
        }));
      } catch (err) {
        console.warn("Gagal fetch dari Drive, mencoba mode offline...", err);
        return [];
      }
    }

    // Load & Cache Media
    async function loadMedia() {
      const apiKey = getApiKey();
      const folderId = getFolderId();

      if (navigator.onLine) {
        const driveMedia = await fetchFromDrive(folderId, apiKey);
        if (driveMedia.length > 0) {
          mediaList = driveMedia;
          try {
            const cache = await caches.open('media-cache-v1');
            mediaList.forEach(m => cache.add(m.url).catch(() => {}));
            localStorage.setItem('cached_media_list', JSON.stringify(mediaList));
          } catch(e) {}
        } else {
          loadFromLocalCache();
        }
      } else {
        loadFromLocalCache();
      }

      showMedia(currentIndex);
    }

    function loadFromLocalCache() {
      const stored = localStorage.getItem('cached_media_list');
      if (stored) {
        mediaList = JSON.parse(stored);
      }
    }

    // Tampilkan Media (Foto / Video)
    function showMedia(index) {
      const display = document.getElementById('media-display');
      if (mediaList.length === 0) {
        display.innerHTML = '<h3 style="color:white; text-align:center; padding: 20px;">Belum ada konten.<br><small style="font-size:0.8rem; color:#aaa;">Goyangkan mouse & buka menu Admin untuk mengatur API Key / Folder ID.</small></h3>';
        return;
      }

      if (index >= mediaList.length) {
        currentIndex = 0;
        index = 0;
      }

      const item = mediaList[index];
      if (item.type === 'video') {
        display.innerHTML = `<video src="${item.url}" autoplay muted loop style="max-width:100vw; max-height:100vh;"></video>`;
      } else {
        display.innerHTML = `<img src="${item.url}" style="max-width:100vw; max-height:100vh;">`;
      }
    }

    // Schedular Jalannya Slider
    function startSlider() {
      const intervalMs = getSlideInterval() * 1000;
      clearInterval(slideTimer);
      slideTimer = setInterval(() => {
        if (mediaList.length > 0) {
          currentIndex = (currentIndex + 1) % mediaList.length;
          showMedia(currentIndex);
        }
      }, intervalMs);
    }

    // Fungsi Admin Modal
    function loginAdmin() {
      const passInput = document.getElementById('admin-pass').value;
      if (passInput === getAdminPassword()) {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('admin-controls').classList.remove('hidden');
      } else {
        alert('Password Admin Salah!');
      }
    }

    function saveSettings() {
      const apiKeyInput = document.getElementById('drive-api-key').value.trim();
      const folderIdInput = document.getElementById('drive-folder-id').value.trim();
      const intervalInput = document.getElementById('slide-interval').value;
      const newPassInput = document.getElementById('new-admin-pass').value.trim();

      if (apiKeyInput) {
        localStorage.setItem('drive_api_key', apiKeyInput);
      } else {
        localStorage.removeItem('drive_api_key');
        document.getElementById('drive-api-key').value = DEFAULT_API_KEY;
      }

      if (folderIdInput) {
        localStorage.setItem('drive_folder_id', folderIdInput);
      } else {
        localStorage.removeItem('drive_folder_id');
        document.getElementById('drive-folder-id').value = DEFAULT_FOLDER_ID;
      }

      if (intervalInput) {
        localStorage.setItem('slide_interval', intervalInput);
      } else {
        localStorage.removeItem('slide_interval');
        document.getElementById('slide-interval').value = DEFAULT_INTERVAL;
      }

      if (newPassInput) {
        localStorage.setItem('admin_password', newPassInput);
        alert('Pengaturan dan Password Admin baru berhasil disimpan!');
      } else {
        alert('Pengaturan disimpan! (Menggunakan konfigurasi Default untuk kolom yang kosong)');
      }

      loadMedia();
      startSlider();
      closeAdminModal();
    }

    function openAdminModal() {
      document.getElementById('admin-modal').classList.remove('hidden');
    }

    function closeAdminModal() {
      document.getElementById('admin-modal').classList.add('hidden');
    }

    function logoutAdmin() {
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('admin-controls').classList.add('hidden');
      document.getElementById('admin-pass').value = '';
      document.getElementById('new-admin-pass').value = '';
    }
  </script>
</body>
</html>
